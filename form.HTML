<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CONTACT DETAIL FORM</title>
</head>
<body>
    <form>
        <fieldset>
            <legend>Contact Detail Form</legend>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required><br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required><br><br>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone"><br><br>

            <label for="message">Message:</label><br>
            <textarea id="message" name="message" rows="4" cols="50"></textarea><br><br>
               <select>
                <option value="option1">select your age</option>
                <option value="option2">1</option>
                <option value="option2">2</option>
                <option value="option2">3</option>
                <option value="option2">4</option>
                <option value="option2">5</option>
                <option value="option2">6</option>
                <option value="option2">7</option>
                <option value="option2">8</option>
            </select>
            <legend>Choose an option:</legend>
            <input type="radio" id="option1" name="option" value="option1">
            <label for="option1">male</label><br>
            <input type="radio" id="option2" name="option" value="option2">
            <label for="option2">female</label><br>
            <input type="radio" id="option3" name="option" value="option3">
                <label for="option3">other</label><br><br>
            <input type="checkbox" id="signup" name="signup" value="signup">
            <label for="signup">Sign up for email updates</label><br><br>
         

            <input type="submit" value="Submit">
        </fieldset>
    </form>

<form>

    <fieldset style="width: 400px;">

        <legend>Contact details</legend>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email"><br><br>

        <label for="mobile">Mobile:</label><br>
        <input type="tel" id="mobile" name="mobile"><br><br>

        <label for="telephone">Telephone:</label><br>
        <input type="tel" id="telephone" name="telephone"><br><br>

    </fieldset>

</body>
</html>
